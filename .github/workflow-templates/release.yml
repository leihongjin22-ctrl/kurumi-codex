name: Build Kurumi Codex
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Build verified Windows portable and plugin source
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kurumi-codex-release
          path: dist/*
      - name: Create draft release for a version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG --draft --title "Kurumi Codex $env:RELEASE_TAG" --notes-file docs-public/RELEASE-NOTES.md dist/*.zip dist/SHA256SUMS.txt dist/build-info.json
